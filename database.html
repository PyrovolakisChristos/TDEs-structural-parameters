  <style>

    .band-toggle button { padding: 8px 12px; border-radius:6px; border:1px solid #ccc; background: #fff; cursor:pointer; }

    .search-box button:hover { background: #34495e; }
    .stats { margin-bottom: 20px; padding: 10px; background: #f9f9f9; border-left: 3px solid #2c3e50; font-size: 0.9rem; }
    .stats strong { color: #2c3e50; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: #2c3e50; color: white; padding: 12px; text-align: left; font-weight: 600; font-size: 0.9rem; cursor: pointer; user-select: none; }
    th:hover { background: #34495e; }
    td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    tr:hover { background: #f9f9f9; }
    .band-r { background: #e3f2fd; font-weight: 600; }
    .band-g { background: #e8f5e9; font-weight: 600; }
    .no-results { padding: 20px; text-align: center; color: #999; }

      renderG();
    }

    function showBand(band, replaceURL = true) {
      currentVisible = band;
      document.getElementById('btn-r').classList.toggle('active', band === 'r');
      document.getElementById('btn-g').classList.toggle('active', band === 'g');
      document.getElementById('rContainer').style.display = band === 'r' ? 'block' : 'none';
      document.getElementById('gContainer').style.display = band === 'g' ? 'block' : 'none';
      // update URL so the link reflects the selected band
      try {
        if (replaceURL) {
          const url = new URL(window.location.href);
          url.searchParams.set('band', band);
          window.history.replaceState(null, '', url.toString());
        }
      } catch (e) {
        // ignore if URL API not available
      }
      renderR();
      renderG();
    }

    function search() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      if (currentVisible === 'r') renderR(term);
      else renderG(term);
    }

    function reset() {
      document.getElementById('searchInput').value = '';
      renderR();
      renderG();
    }

    function renderR(filter='') {
      const tbody = document.getElementById('rTableBody');
      const noResults = document.getElementById('noResults');
      tbody.innerHTML = '';
      const rows = rData.filter(row => !filter || row.some(cell => String(cell).toLowerCase().includes(filter)));
      if (rows.length === 0) { if (currentVisible==='r') noResults.style.display='block'; return; }
      noResults.style.display='none';
      rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => { const td=document.createElement('td'); td.textContent=cell; tr.appendChild(td); });
        tbody.appendChild(tr);
      });
    }

    function renderG(filter='') {
      const tbody = document.getElementById('gTableBody');
      const noResults = document.getElementById('noResults');
      tbody.innerHTML = '';
      const placeholders = ["AT2023clx", "AT2024gxr"];
      // start with the gData rows, but exclude placeholder rows from the source array
      let rows = gData.filter(row => !placeholders.includes(String(row[0])));
      // apply text filter if present
      if (filter) rows = rows.filter(row => row.some(cell => String(cell).toLowerCase().includes(filter)));
      // append placeholder rows at the bottom if they are not already present
      placeholders.forEach(name => {
        if (!rows.find(r => String(r[0]).toLowerCase() === name.toLowerCase())) {
          rows.push([name, "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"]);
        }
      });
      if (rows.length === 0) { if (currentVisible==='g') noResults.style.display='block'; return; }
      noResults.style.display='none';
      rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => { const td=document.createElement('td'); td.textContent=cell; tr.appendChild(td); });
        tbody.appendChild(tr);
      });
    }

    document.getElementById('searchInput').addEventListener('keyup', search);
    // initialize from URL param if present, otherwise default to r
    (function initBandFromURL(){
      let initial = 'r';
      try {
        const params = new URLSearchParams(window.location.search);
        const b = params.get('band');
        if (b === 'r' || b === 'g') initial = b;
      } catch (e) {}
      // showBand(false) will update the UI and avoid replacing the URL on load
      showBand(initial, false);
    })();
  </script>
</body>
</html>
